<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Lovable App</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Lovable App" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages (serving raw source) would 404 on /src/main.tsx.
      // Redirect to the standalone docs/ build to avoid blank page.
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      const alreadyInDocs = window.location.pathname.includes("/docs/");

      if (isGitHubPages && !alreadyInDocs) {
        const target = new URL("./docs/", window.location.href);
        window.location.replace(target.toString());
      } else {
        const s = document.createElement("script");
        s.type = "module";
        s.src = "/src/main.tsx";
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
